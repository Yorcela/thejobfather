<style>
/* Fiche façon CV : une feuille centrée, rubriques empilées dans l'ordre choisi par le propriétaire, tiroir de personnalisation à droite. */
:root {
  /* Couleurs de la fiche : le propriétaire peut les remplacer, tout le reste en découle */
  --bg: #eef1f4;
  --paper: #ffffff;
  --ink: #1f2933;
  --accent: #1f6f8b;
  --title: #12506e;
  --muted: color-mix(in srgb, var(--ink) 62%, var(--paper));
  --line: color-mix(in srgb, var(--ink) 16%, var(--paper));
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--paper));
  /* Interface de personnalisation : jamais modifiable, pour ne pas s'enfermer dehors */
  --ui-bg: #ffffff; --ui-ink: #14202b; --ui-muted: #5b6b79; --ui-line: #d3dae1;
  --ui-accent: #0b6e6e; --ui-on-accent: #ffffff; --ui-field: #f4f6f8;
  --warn: #8a5a00; --warn-soft: #fbefd3;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171e; --paper: #17222b; --ink: #e6edf2; --accent: #6cc0dd; --title: #a5d9ec;
    --ui-bg: #1b2833; --ui-ink: #e8eef3; --ui-muted: #92a3b1; --ui-line: #2f4150;
    --ui-accent: #5fc4c0; --ui-on-accent: #0b1a1a; --ui-field: #223341;
    --warn: #f0c36a; --warn-soft: #3a2f14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171e; --paper: #17222b; --ink: #e6edf2; --accent: #6cc0dd; --title: #a5d9ec;
  --ui-bg: #1b2833; --ui-ink: #e8eef3; --ui-muted: #92a3b1; --ui-line: #2f4150;
  --ui-accent: #5fc4c0; --ui-on-accent: #0b1a1a; --ui-field: #223341;
  --warn: #f0c36a; --warn-soft: #3a2f14;
  color-scheme: dark;
}
:root[data-font="classic"] { --font-display: "Source Serif 4", Georgia, "Times New Roman", serif; }
:root[data-font="neutral"] { --font-display: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; --font-body: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 1180px) { body.customizing { padding-right: calc(392px + env(safe-area-inset-right, 0px)); } }
h1, h2, h3, h4, p, ul { margin: 0; }
h1, h3 { font-family: var(--font-display); text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); overflow-wrap: anywhere; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }

.page { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; justify-content: flex-end; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px;
  border: 1px solid var(--ui-line); background: var(--ui-bg); color: var(--ui-ink); cursor: pointer; font-size: 14px; font-weight: 500;
}
.btn:hover { border-color: var(--ui-accent); }
.btn.primary { background: var(--ui-accent); color: var(--ui-on-accent); border-color: var(--ui-accent); }
.btn.danger { color: var(--warn); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }

.sheet {
  background: var(--paper); color: var(--ink);
  padding: clamp(20px, 5vw, 48px); border: 1px solid var(--line); border-radius: 6px;
  display: flex; flex-direction: column; gap: 30px;
}
.id { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; padding-bottom: 18px; border-bottom: 2px solid var(--accent); }
.id-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
h1 { font-size: clamp(28px, 5vw, 36px); line-height: 1.1; font-weight: 700; color: var(--title); }
.headline { color: var(--muted); font-size: 16px; }
.facts { color: var(--muted); font-size: 13.5px; line-height: 1.7; display: flex; flex-wrap: wrap; align-items: baseline; }
.facts > span + span::before { content: "·"; margin: 0 .55em; }
.photo { width: 108px; height: 108px; flex: none; border-radius: 14px; object-fit: cover; border: 1px solid var(--line); background: var(--accent-soft); }
@media (max-width: 520px) { .photo { width: 80px; height: 80px; } .id { gap: 12px; } }
.source { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
h2 { font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-family: var(--font-body); }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.sec.dim > :not(.sec-head) { opacity: .5; }
.sec p + p { margin-top: 8px; }
.sec p { max-width: 78ch; }

.cat b { color: var(--title); font-weight: 600; }
.cat + .cat { margin-top: 2px; }

.entry { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.entry + .entry { margin-top: 10px; }
.entry-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
h3 { font-size: 16px; font-weight: 700; line-height: 1.3; }
.period { font-size: 13px; color: var(--muted); white-space: nowrap; }
.period b { color: var(--ink); font-weight: 600; }
.org { color: var(--muted); font-size: 13.5px; }
.org b { color: var(--accent); font-weight: 600; }
h4 { margin-top: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.entry ul { padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; margin-top: 3px; }
.entry li { position: relative; padding-left: 18px; overflow-wrap: anywhere; }
.entry li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: 13px; padding: 1px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }

.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 220px) auto; gap: 2px 14px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.row.head { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row .y { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.row .inst { color: var(--muted); }
@media (max-width: 560px) {
  .row { grid-template-columns: 52px minmax(0, 1fr) auto; }
  .row .inst { grid-column: 2; }
  .row.head .inst { display: none; }
}
.hobby + .hobby { margin-top: 4px; }

.edit-btn { display: none; align-self: flex-start; margin-top: 4px; }
body.customizing .edit-btn { display: inline-flex; }
.warnings { padding: 12px 16px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.warnings ul { padding-left: 18px; margin-top: 4px; }
.warnings .wlist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.warnings .wlist li { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.warnings .wlist .btn { flex: none; }
.empty { padding: 36px 24px; border: 1px dashed var(--line); border-radius: 10px; background: var(--paper); display: flex; flex-direction: column; gap: 8px; }
.empty code { font-size: 13px; }
.placeholder { padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 14px; }

/* Tiroir de personnalisation */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 20;
  background: var(--ui-bg); color: var(--ui-ink); border-left: 1px solid var(--ui-line);
  box-shadow: -8px 0 28px rgba(0, 0, 0, .18);
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }
.panel-head strong { font-family: var(--font-display); font-size: 17px; }
.tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--ui-line); }
.tab { padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: var(--ui-muted); font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ui-ink); border-bottom-color: var(--ui-accent); }
.panel-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.note { color: var(--ui-muted); font-size: 13.5px; }
.slist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.sitem { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-field); }
.sctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
.sctl label { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.sitem .meta { font-size: 12px; color: var(--ui-muted); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .lab { font-size: 13px; font-weight: 600; }
input[type="text"], select, textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--ui-line); border-radius: 7px; background: var(--ui-field); color: var(--ui-ink);
}
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.crow { display: flex; align-items: center; gap: 10px; }
.crow label { flex: 1; font-size: 14px; }
input[type="color"] { width: 44px; height: 32px; padding: 2px; border: 1px solid var(--ui-line); border-radius: 7px; background: var(--ui-field); cursor: pointer; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border: 1px solid var(--ui-line); border-radius: 999px; background: var(--ui-field); color: var(--ui-ink); cursor: pointer; font-size: 13.5px; }
.swatch i { width: 18px; height: 18px; border-radius: 50%; display: block; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 20, .55); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { width: min(640px, 100%); margin: auto; background: var(--ui-bg); color: var(--ui-ink); border: 1px solid var(--ui-line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { font-family: var(--font-display); text-transform: none; letter-spacing: 0; font-size: 19px; color: var(--ui-ink); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.grp { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--ui-line); border-radius: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .sp { flex: 1; }
.err { color: var(--warn); font-size: 13.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 60; padding: 9px 16px; border-radius: 8px; background: var(--ui-ink); color: var(--ui-bg); font-size: 14px; max-width: calc(100% - 32px); }
</style>

<div class="page">
  <div class="bar"><button id="export" class="btn" type="button" hidden>Export PDF</button><button id="toggle" class="btn" type="button" aria-expanded="false" aria-controls="panel" hidden>Customize</button></div>

<script>
(function () {
  var SECTIONS = [{ id: "profile" }, { id: "skills" }, { id: "experiences" }, { id: "projects" }, { id: "education" }, { id: "hobbies" }];
  var COLLS = ["experiences", "education", "skills", "languages", "certifications", "projects", "hobbies"];
  var THEME_KEYS = [
    ["accent", "Accent (section titles, links)"],
    ["title", "Name and subheadings"],
    ["ink", "Text"],
    ["paper", "Resume background"],
    ["bg", "Page background"]
  ];
  var PRESETS = [
    { name: "Blue", accent: "#1f6f8b", title: "#12506e" },
    { name: "Green", accent: "#2f7d55", title: "#1d5a3b" },
    { name: "Plum", accent: "#8a3f78", title: "#64285a" },
    { name: "Graphite", accent: "#3d4a57", title: "#1f2933" }
  ];
  var FONTS = [["modern", "Modern"], ["classic", "Classic (serif headings)"], ["neutral", "Neutral (system font)"]];

  /* Libellés de la fiche (pas du tiroir) : anglais par défaut, la commande translate écrit lang et labels dans settings/layout */
  var DICT = {
    en: { sec_profile: "Profile", sec_skills: "Skills", sec_experiences: "Professional Experience", sec_projects: "Personal Projects", sec_education: "Education & Certifications", sec_hobbies: "Hobbies", languages: "Languages", today: "today", year: "year", years: "years", month: "month", months: "months", col_year: "Year", col_degree: "Degree / Certification", col_institution: "Institution", photo_of: "Photo of", years_old: "years old" },
    fr: { sec_profile: "Profil", sec_skills: "Compétences", sec_experiences: "Expérience professionnelle", sec_projects: "Projets personnels", sec_education: "Éducation & certifications", sec_hobbies: "Hobbies", languages: "Langues", today: "aujourd'hui", year: "an", years: "ans", month: "mois", months: "mois", col_year: "Année", col_degree: "Diplôme / certification", col_institution: "Établissement", photo_of: "Photo de", years_old: "ans" }
  };
  var LABEL_KEYS = Object.keys(DICT.en);
  var EN_MONTHS = ["Jan.", "Feb.", "Mar.", "Apr.", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
  function L(key) {
    var s = state.settings, base = String(s.lang || "en").slice(0, 2).toLowerCase();

  }

  var db = null, assetsApi = null, downloadsApi = null;
  var state = { profile: null, meta: null, settings: norm(null), data: {}, panelOpen: false, tab: "sections" };
  COLLS.forEach(function (c) { state.data[c] = []; });

  var $ = function (id) { return document.getElementById(id); };
  function h(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null && text !== "") el.textContent = text;
    return el;
  }
  function btn(label, cls, fn) {
    var b = h("button", "btn " + (cls || ""), label);
    b.type = "button";
    if (fn) b.addEventListener("click", fn);
    return b;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  function isHex(v) { return typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v); }
  function slug(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "x"; }
  function uid(prefix) { return prefix + "-u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function sectionTitle(id) { return L("sec_" + id); }
  /* Un retour à la ligne simple est un retour naturel du texte : on le recolle. Seule une ligne vide sépare deux paragraphes. */
  function flow(s) {
    return String(s == null ? "" : s).split(/\n\s*\n/).map(function (x) { return x.replace(/\s*\n\s*/g, " ").trim(); }).filter(Boolean).join("\n\n");
  }

  /* ---------- Dates ---------- */
  function parseYm(s) {
    var m = String(s == null ? "" : s).match(/^(\d{4})(?:-(\d{2}))?$/);
    return m ? { y: +m[1], m: m[2] ? +m[2] : null } : null;
  }
  function fmtDate(s) {
    var p = parseYm(s);
    if (!p) return s ? String(s) : "";
    if (!p.m) return String(p.y);

    try { return new Date(p.y, p.m - 1, 1).toLocaleDateString(lang, { month: "short", year: "numeric" }); }

  }
  function duration(d) {
    var a = parseYm(d.start), b;

  }
  function timeNode(raw, text) {
    var t = h("time", null, text);
    if (parseYm(raw)) t.setAttribute("datetime", String(raw));
    return t;
  }
  /* Dates toujours au même format : « Sept. 2024 - today » */
  function periodNode(d) {
    var from = fmtDate(d.start), to = d.current ? L("today") : fmtDate(d.end);
    if (!from && !to) return null;
    var el = h("div", "period"), b = h("b");
    if (from) b.appendChild(timeNode(d.start, from));

    if (to) b.appendChild(d.current ? document.createTextNode(to) : timeNode(d.end, to));

  }
  function byStartDesc(a, b) { return String(b.start || "").localeCompare(String(a.start || "")); }

  /* ---------- Réglages ---------- */
  function norm(d) {
    d = d || {};
    var ids = SECTIONS.map(function (s) { return s.id; });
    var order = [];
    arr(d.order).forEach(function (id) { if (ids.indexOf(id) >= 0 && order.indexOf(id) < 0) order.push(id); });
    ids.forEach(function (id) { if (order.indexOf(id) < 0) order.push(id); });

    if (d.titles && typeof d.titles === "object") ids.forEach(function (id) { if (typeof d.titles[id] === "string" && d.titles[id].trim()) titles[id] = d.titles[id].slice(0, 80); });

  function persist() {
    if (!db) return;

    var wrapEl = h("div", "field");

    var lab = h("label", null, f.l); lab.setAttribute("for", id);
    var el, get;
    if (f.t === "checkbox") {

    }
    if (f.t === "textarea" || f.t === "lines" || f.t === "tags" || f.t === "pairs") {
      el = document.createElement("textarea"); el.id = id;
      var v = "";
      if (f.t === "lines") v = arr(value).join("\n");
      else if (f.t === "tags") v = arr(value).join(", ");

      if (f.rows) el.rows = f.rows;
      get = function () {
        var s = el.value;
        if (f.t === "lines") return s.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
        if (f.t === "tags") return s.split(/[,\n]/).map(function (x) { return x.trim(); }).filter(Boolean);

    function fail(e) { busy(false); err.hidden = false; err.textContent = "Could not save: " + (e && e.message ? e.message : "unknown error"); }

  /* ---------- Export PDF ----------

  function periodText(d) {

    var txt = from && to ? from + " - " + to : (from || to);

  function loadPhoto(id) {

      var img = new Image();

  function buildPdf(photo) {

    var theme = state.settings.theme;

    var cInk = [31, 41, 51], cMuted = [91, 107, 121], cLine = [205, 212, 219];
    var p = state.profile || {}, d = state.data;

    function S(x) {

    /* paragraphe : lignes entières, jamais coupé entre deux pages */

    /* « Libellé : texte » : le libellé en gras et en couleur, le reste normal, sur le même paragraphe */

    /* ----- en-tête : nom, accroche, coordonnées, photo ----- */

      var links = arr(p.links).filter(function (l) { return l && safeUrl(l.url); }).map(function (l) { return { text: S((l.label ? l.label + ": " : "") + l.url), url: l.url }; });
      var linkL = partsLines(links, 9, left);
      var textH = nameL.length * 26 + (headL.length ? 3 + headL.length * 15 : 0) + (factL.length ? 4 + factL.length * 13 : 0) + (linkL.length ? 2 + linkL.length * 13 : 0);
      var h0 = Math.max(textH, photo ? 80 : 0) + 12;
      add({ before: 0, keep: false, h: h0, draw: function (y) {
        var ty = y;

        ty += nameL.length * 26;
        if (headL.length) { ty += 3; font("normal", 11, cMuted); headL.forEach(function (ln, i) { doc.text(ln, X, ty + i * 15 + 11); }); ty += headL.length * 15; }
        if (factL.length) { ty += 4; drawParts(factL, ty, 9, 13); ty += factL.length * 13; }

    })();

    /* ----- entrées d'expérience et de projet ----- */
    function entry(x, kind, first) {

        if (per) { font("normal", 9, cMuted); doc.text(S(per), X + W, y + 10, { align: "right" }); }

      if (id === "profile") {

      } else if (id === "skills") {
        var cats = {}, order = [];
        d.skills.forEach(function (s) { var c = s.category || "Skills"; if (!cats[c]) { cats[c] = []; order.push(c); } cats[c].push(s); });
        order.forEach(function (c, i) { lead(c, inlineList(cats[c]), { size: 9.5, lh: 13.5, before: i === 0 ? 7 : 5, sep: ": ", leadColor: cTitle, restColor: cInk }); });
        if (d.languages.length) lead(L("languages"), inlineList(d.languages), { size: 9.5, lh: 13.5, before: order.length ? 5 : 7, sep: ": ", leadColor: cTitle, restColor: cInk });
      } else if (id === "experiences" || id === "projects") {
        d[id].slice().sort(byStartDesc).forEach(function (x, i) { entry(x, id, i === 0); });
      } else if (id === "education") {
        var rows = [];
        d.education.forEach(function (x) { rows.push({ year: (parseYm(x.end) || parseYm(x.start) || {}).y || "", what: [x.degree, x.field].filter(Boolean).join(", ") || "Degree", inst: x.school || "" }); });
        d.certifications.forEach(function (x) { rows.push({ year: (parseYm(x.date) || {}).y || "", what: x.name || "Certification", inst: x.issuer || "" }); });
        rows.sort(function (a, b) { return (b.year || 0) - (a.year || 0); });
        var YW = 46, IW = 160, DW = W - YW - IW - 14;
        add({ before: 7, keep: true, h: 14, draw: function (y) {
          font("bold", 8, cMuted);
          doc.text(S(L("col_year")).toUpperCase(), X, y + 8); doc.text(S(L("col_degree")).toUpperCase(), X + YW, y + 8); doc.text(S(L("col_institution")).toUpperCase(), X + W - IW, y + 8);
        } });
        rows.forEach(function (r) {
          var dl = wrap(r.what, 9.5, "normal", DW), il = wrap(r.inst, 9.5, "normal", IW), n = Math.max(dl.length, il.length, 1);
          add({ before: 3, keep: false, h: n * 13, draw: function (y) {
            font("bold", 9.5, cAccent); doc.text(S(r.year ? String(r.year) : ""), X, y + 9.5);
            font("normal", 9.5, cInk); dl.forEach(function (ln, i) { doc.text(ln, X + YW, y + i * 13 + 9.5); });
            font("normal", 9.5, cMuted); il.forEach(function (ln, i) { doc.text(ln, X + W - IW, y + i * 13 + 9.5); });
          } });
        });
      } else if (id === "hobbies") {
        d.hobbies.forEach(function (x, i) { lead(x.name || "Hobby", x.description || "", { size: 9.5, lh: 13.5, before: i === 0 ? 7 : 3, sep: ": ", leadColor: cTitle, restColor: cInk }); });
      }
    });

    /* ----- pagination : un titre n'est jamais seul en bas de page ----- */
    var y = PDFG.MT, atTop = true;
    function newPage() { doc.addPage(); y = PDFG.MT; atTop = true; }
    var i = 0;
    while (i < blocks.length) {
      var j = i;
      while (j < blocks.length - 1 && blocks[j].keep) j++;
      var need = 0, k;
      for (k = i; k <= j; k++) need += (k === i && atTop ? 0 : blocks[k].before) + blocks[k].h;
      if (!atTop && y + need > USABLE && need <= USABLE - PDFG.MT) newPage();
      for (k = i; k <= j; k++) {
        var b = blocks[k], gap = atTop ? 0 : b.before;
        if (!atTop && y + gap + b.h > USABLE) { newPage(); gap = 0; }
        y += gap; b.draw(y); y += b.h; atTop = false;
      }
      i = j + 1;
    }

    var name = S(p.fullName || "Resume");
    try { doc.setProperties({ title: name + " - Resume", author: name, subject: "Resume" }); } catch (e) { /* facultatif */ }
    try { doc.setLanguage(state.settings.lang === "en" ? "en-US" : state.settings.lang); } catch (e) { /* facultatif */ }
    return { bytes: doc.output("arraybuffer"), name: name.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "") + "_Resume.pdf", lost: lost, pages: doc.getNumberOfPages() };
  }

  function exportPdf() {
    if (!downloadsApi) return;
    var b = $("export");
    b.disabled = true;
    loadPhoto(state.profile && state.profile.photoAssetId).then(function (photo) {
      var out = buildPdf(photo);
      return downloadsApi.save({ filename: out.name, data: out.bytes }).then(function () {
        toast(out.lost ? "PDF saved. " + out.lost + " character(s) outside the PDF font were replaced with “?”." : "PDF saved.");
      });
    }).catch(function (e) {
      toast(e && e.code === "declined" ? "Export cancelled." : "Export failed: " + (e && e.message ? e.message : "unknown error"));
    }).then(function () { b.disabled = false; });
  }

  /* ---------- Démarrage ---------- */
  function showError(msg) {
    $("empty").hidden = false; $("sheet").hidden = true; $("warnings").hidden = true;
    clear($("empty"));
    $("empty").appendChild(h("h1", null, "Database unavailable"));
    $("empty").appendChild(h("p", null, msg));
  }
  function panelBusy() {
    var a = document.activeElement, p = $("panel");
    return !!(a && p.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
  }

  applyTheme();
  $("toggle").addEventListener("click", function () { setPanel(!state.panelOpen); });
  $("export").addEventListener("click", exportPdf);
  window.claude.use("assets").then(function (a) { assetsApi = a; }, function () { assetsApi = null; });
  window.claude.use("downloads").then(function (a) { downloadsApi = a; if (db) render(); }, function () { downloadsApi = null; });
  window.claude.use("db").then(function (store) {
    if (!store) { showError("Open this artifact signed in to your account to view your profile."); return; }
    db = store;
    $("toggle").hidden = false;
    var onErr = function () { showError("Could not read the database. Reload the page."); };
    db.doc("profile/me").onSnapshot(function (s) { state.profile = s.exists ? s.data() : null; render(); }, onErr);
    db.doc("meta/import").onSnapshot(function (s) { state.meta = s.exists ? s.data() : null; render(); }, onErr);
    db.doc("settings/layout").onSnapshot(function (s) {
      state.settings = norm(s.exists ? s.data() : null);
      applyTheme(); render();
      if (state.panelOpen && !panelBusy()) renderPanel();
    }, onErr);
    COLLS.forEach(function (name) {
      db.collection(name).onSnapshot(function (snap) {
        state.data[name] = snap.docs.map(function (d) { return Object.assign({ _id: d.id }, d.data()); });
        render();
      }, onErr);
    });
  }, function () { showError("Database capability unavailable."); });
})();
</script>
