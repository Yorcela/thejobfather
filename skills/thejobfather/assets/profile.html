<style>
/* Fiche façon CV : une feuille centrée, rubriques empilées dans l'ordre choisi par le propriétaire, tiroir de personnalisation à droite. */
:root {
  /* Couleurs de la fiche : le propriétaire peut les remplacer, tout le reste en découle */
  --bg: #eef1f4;
  --paper: #ffffff;
  --ink: #1f2933;
  --accent: #1f6f8b;
  --title: #12506e;
  --muted: color-mix(in srgb, var(--ink) 62%, var(--paper));

  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--paper));

  --ui-bg: #ffffff; --ui-ink: #14202b; --ui-muted: #5b6b79; --ui-line: #d3dae1;
  --ui-accent: #0b6e6e; --ui-on-accent: #ffffff; --ui-field: #f4f6f8;

    --ui-bg: #1b2833; --ui-ink: #e8eef3; --ui-muted: #92a3b1; --ui-line: #2f4150;
    --ui-accent: #5fc4c0; --ui-on-accent: #0b1a1a; --ui-field: #223341;
    --warn: #f0c36a; --warn-soft: #3a2f14;

  }
}

  --ui-bg: #1b2833; --ui-ink: #e8eef3; --ui-muted: #92a3b1; --ui-line: #2f4150;
  --ui-accent: #5fc4c0; --ui-on-accent: #0b1a1a; --ui-field: #223341;
  --warn: #f0c36a; --warn-soft: #3a2f14;
  color-scheme: dark;
}
:root[data-font="classic"] { --font-display: "Source Serif 4", Georgia, "Times New Roman", serif; }
:root[data-font="neutral"] { --font-display: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; --font-body: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }

* { box-sizing: border-box; }
body {

  font: 15px/1.55 var(--font-body);

a { color: var(--accent); overflow-wrap: anywhere; }

.page { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.vwrap { position: relative; }
.vmenu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; width: min(380px, calc(100vw - 32px)); background: var(--ui-bg); color: var(--ui-ink); border: 1px solid var(--ui-line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .22); padding: 6px; display: flex; flex-direction: column; gap: 2px; }

.org b { color: var(--accent); font-weight: 600; }

.entry li { position: relative; padding-left: 18px; overflow-wrap: anywhere; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: 13px; padding: 1px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }

.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 220px) auto; gap: 2px 14px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.row.head { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row .y { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

.warnings { padding: 12px 16px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }

.placeholder { padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 14px; }

/* Tiroir de personnalisation */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 20;
  background: var(--ui-bg); color: var(--ui-ink); border-left: 1px solid var(--ui-line);

}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }

.tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--ui-line); }

.tab[aria-selected="true"] { color: var(--ui-ink); border-bottom-color: var(--ui-accent); }

.note { color: var(--ui-muted); font-size: 13.5px; }
.slist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.sitem { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-field); }
.sctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
.sctl label { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.sitem .meta { font-size: 12px; color: var(--ui-muted); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .lab { font-size: 13px; font-weight: 600; }
input[type="text"], select, textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--ui-line); border-radius: 7px; background: var(--ui-field); color: var(--ui-ink);
}
textarea { resize: vertical; min-height: 58px; line-height: 1.45; }
.crow { display: flex; align-items: center; gap: 10px; }
.crow label { flex: 1; font-size: 14px; }

.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border: 1px solid var(--ui-line); border-radius: 999px; background: var(--ui-field); color: var(--ui-ink); cursor: pointer; font-size: 13.5px; }
.swatch i { width: 18px; height: 18px; border-radius: 50%; display: block; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.grp > .btn, .field > .btn { align-self: flex-start; }
.dialog .sub, .formpage .sub { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ui-muted); padding-top: 4px; border-top: 1px solid var(--ui-line); }

.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 20, .55); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { width: min(640px, 100%); margin: auto; background: var(--ui-bg); color: var(--ui-ink); border: 1px solid var(--ui-line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .sp { flex: 1; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 60; padding: 9px 16px; border-radius: 8px; background: var(--ui-ink); color: var(--ui-bg); font-size: 14px; max-width: calc(100% - 32px); }

/* édition sur place (mode Customize) */
body.customizing .ie { cursor: text; border-radius: 4px; outline: 1px dashed transparent; outline-offset: 2px; transition: outline-color .12s, background-color .12s; }

.ie-input { font: inherit; color: inherit; line-height: inherit; background: var(--paper); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; box-sizing: border-box; min-width: 14ch; resize: none; }

</style>

      },
      validate: function (v) {
        var i, r, lo, hi, d;
        for (i = 0; i < v.roles.length; i++) {
          r = v.roles[i];
          if (!r.title) return "Each role needs a job title.";
          var pairs = [["salary", r.salary], ["daily rate", r.dailyRate]];
          for (var k = 0; k < pairs.length; k++) {
            if (!pairs[k][1]) continue;
            lo = numOrNull(pairs[k][1].min); hi = numOrNull(pairs[k][1].max);
            if (isNaN(lo) || isNaN(hi)) return "The " + pairs[k][0] + " figures must be numbers (role: " + r.title + ").";
            if (lo !== null && hi !== null && lo > hi) return "The minimum " + pairs[k][0] + " cannot be above the maximum (role: " + r.title + ").";
          }
        }
        for (i = 0; i < v.places.length; i++) {
          r = v.places[i];

          if (lo === null && hi === null) return null;
          var o = { currency: x.currency || "EUR" };
          if (withPeriod) o.period = x.period || "year";
          if (lo !== null) o.min = lo;
          if (hi !== null) o.max = hi;
          return o;
        }
        if (v.roles.length) d.roles = v.roles.map(function (r) {
          var o = { title: r.title }, sal = range(r.salary, true), tjm = range(r.dailyRate, false);

          if (sal) o.salary = sal;
          if (tjm) o.dailyRate = tjm;
          return o;
        });
        if (v.places.length) d.locations = v.places.map(function (r) {
          var o = { place: r.place }, days = numOrNull(r.days);
          if (r.workModes.length) o.workModes = r.workModes;
          if (days !== null) o.onsiteDaysMax = days;
          return o;

        if (v.relocation) d.relocation = true;
        if (v.sectorsPrefer.length || v.sectorsAvoid.length) d.sectors = { prefer: v.sectorsPrefer, avoid: v.sectorsAvoid };
        if (v.companiesPrefer.length || v.companiesAvoid.length) d.companies = { prefer: v.companiesPrefer, avoid: v.companiesAvoid };
        put("companySizes", v.companySizes); put("languages", v.languages);
        put("mustHave", v.mustHave); put("niceToHave", v.niceToHave); put("dealBreakers", v.dealBreakers); put("notes", v.notes);
        d.updatedAt = new Date().toISOString();
        return db.doc("settings/preferences").set(d);
      }
    });
  }

      var headL = p.headline ? wrap(p.headline, 11, "normal", left) : [];
      var facts = [];
      if (typeof p.age === "number" && p.age > 0) facts.push({ text: S(p.age + " " + L("years_old")) });
      [p.location, p.email, p.phone].forEach(function (x) { if (x) facts.push({ text: S(x) }); });
      if (p.website) facts.push({ text: S(p.website), url: safeUrl(p.website) });
      var factL = partsLines(facts, 9, left);
      var links = arr(p.links).filter(function (l) { return l && safeUrl(l.url); }).map(function (l) { return { text: S((l.label ? l.label + ": " : "") + l.url), url: l.url }; });
      var linkL = partsLines(links, 9, left);
      var textH = nameL.length * 26 + (headL.length ? 3 + headL.length * 15 : 0) + (factL.length ? 4 + factL.length * 13 : 0) + (linkL.length ? 2 + linkL.length * 13 : 0);
      var h0 = Math.max(textH, photo ? 80 : 0) + 12;
      add({ before: 0, keep: false, h: h0, draw: function (y) {
        var ty = y;
        font("display", 22, cTitle);
        nameL.forEach(function (ln, i) { doc.text(ln, X, ty + i * 26 + 21); });
        ty += nameL.length * 26;
        if (headL.length) { ty += 3; font("normal", 11, cMuted); headL.forEach(function (ln, i) { doc.text(ln, X, ty + i * 15 + 11); }); ty += headL.length * 15; }
        if (factL.length) { ty += 4; drawParts(factL, ty, 9, 13); ty += factL.length * 13; }
        if (linkL.length) { ty += 2; drawParts(linkL, ty, 9, 13); }
        if (photo) { try { doc.addImage(photo, "PNG", X + W - 76, y, 76, 76); } catch (e) { /* photo ignorée */ } }
        doc.setDrawColor(cAccent[0], cAccent[1], cAccent[2]); doc.setLineWidth(1.4); doc.line(X, y + h0 - 3, X + W, y + h0 - 3);
      } });
    })();

    /* ----- entrées d'expérience et de projet ----- */
    function entry(x, kind, first) {
      var isP = kind === "projects";
      var title = isP ? (x.role || x.name || "Project") : (x.title || "Position");
      var per = periodText(x), perW = per ? tw(per, 9, "normal") : 0;
      var tl = wrap(title, 10.5, "display", W - (per ? perW + 16 : 0)), lhT = 14.5;
      add({ before: first ? 7 : 12, keep: true, h: tl.length * lhT, draw: function (y) {
        font("display", 10.5, cInk); tl.forEach(function (ln, i) { doc.text(ln, X, y + i * lhT + 10.5); });
        if (per) { font("normal", 9, cMuted); doc.text(S(per), X + W, y + 10, { align: "right" }); }
      } });
      var orgLead = "", orgRest = [];
      if (isP) { if (x.role && x.name) orgLead = x.name; if (x.description) orgRest.push(x.description); if (!orgLead && orgRest.length) { orgLead = ""; } }
      else { orgLead = x.company || ""; [x.companyDescription, x.location, x.employmentType].forEach(function (v) { if (v) orgRest.push(v); }); }
      var hasContentAfter = !!((!isP && x.description) || arr(x.groups).length || arr(x.highlights).length || arr(x.technologies).length);
      if (orgLead || orgRest.length) {
        if (orgLead) lead(orgLead, orgRest.join(" · "), { size: 9, lh: 12.5, before: 1.5, keep: hasContentAfter, sep: " · ", leadColor: cAccent, restColor: cMuted });
        else para(orgRest.join(" · "), { size: 9, lh: 12.5, before: 1.5, keep: hasContentAfter, color: cMuted });
      }
      if (!isP && x.description) flow(x.description).split("\n\n").forEach(function (t) { para(t, { size: 9.5, lh: 13.5, before: 4, color: cInk }); });
      arr(x.groups).forEach(function (g) {
        if (!g || !arr(g.items).length) return;
        if (g.label) para(g.label.toUpperCase(), { size: 8, lh: 11, before: 6, keep: true, style: "bold", color: cAccent });
        bullets(g.items, g.label ? 2 : 4);
      });
      if (arr(x.highlights).length) bullets(x.highlights, 4);
      if (arr(x.technologies).length) lead("Technologies", x.technologies.join(", "), { size: 9, lh: 12.5, before: 4, sep: ": ", leadColor: cTitle, restColor: cInk });
    }

    /* ----- rubriques, dans l'ordre choisi par l'utilisateur ----- */
    var firstSection = true;
    state.settings.order.forEach(function (id) {
      if (state.settings.hidden.indexOf(id) >= 0 || !countOf(id)) return;
      heading(titleOf(id), firstSection ? 20 : 22); firstSection = false;
      if (id === "profile") {
        flow(p.summary).split("\n\n").forEach(function (t, i) { para(t, { size: 9.5, lh: 13.5, before: i === 0 ? 7 : 5, color: cInk }); });
      } else if (id === "skills") {
        var cats = {}, order = [];
        d.skills.forEach(function (s) { var c = s.category || "Skills"; if (!cats[c]) { cats[c] = []; order.push(c); } cats[c].push(s); });
        order.forEach(function (c, i) { lead(c, inlineList(cats[c]), { size: 9.5, lh: 13.5, before: i === 0 ? 7 : 5, sep: ": ", leadColor: cTitle, restColor: cInk }); });
        if (d.languages.length) lead(L("languages"), inlineList(d.languages), { size: 9.5, lh: 13.5, before: order.length ? 5 : 7, sep: ": ", leadColor: cTitle, restColor: cInk });
      } else if (id === "experiences" || id === "projects") {
        d[id].slice().sort(byStartDesc).forEach(function (x, i) { entry(x, id, i === 0); });
      } else if (id === "education") {
        var rows = [];
        d.education.forEach(function (x) { rows.push({ year: (parseYm(x.end) || parseYm(x.start) || {}).y || "", what: [x.degree, x.field].filter(Boolean).join(", ") || "Degree", inst: x.school || "" }); });
        d.certifications.forEach(function (x) { rows.push({ year: (parseYm(x.date) || {}).y || "", what: x.name || "Certification", inst: x.issuer || "" }); });
        rows.sort(function (a, b) { return (b.year || 0) - (a.year || 0); });
        var YW = 46, IW = 160, DW = W - YW - IW - 14;
        add({ before: 7, keep: true, h: 14, draw: function (y) {
          font("bold", 8, cMuted);
          doc.text(S(L("col_year")).toUpperCase(), X, y + 8); doc.text(S(L("col_degree")).toUpperCase(), X + YW, y + 8); doc.text(S(L("col_institution")).toUpperCase(), X + W - IW, y + 8);
        } });
        rows.forEach(function (r) {
          var dl = wrap(r.what, 9.5, "normal", DW), il = wrap(r.inst, 9.5, "normal", IW), n = Math.max(dl.length, il.length, 1);
          add({ before: 3, keep: false, h: n * 13, draw: function (y) {
            font("bold", 9.5, cAccent); doc.text(S(r.year ? String(r.year) : ""), X, y + 9.5);
            font("normal", 9.5, cInk); dl.forEach(function (ln, i) { doc.text(ln, X + YW, y + i * 13 + 9.5); });
            font("normal", 9.5, cMuted); il.forEach(function (ln, i) { doc.text(ln, X + W - IW, y + i * 13 + 9.5); });
          } });
        });
      } else if (id === "hobbies") {
        d.hobbies.forEach(function (x, i) { lead(x.name || "Hobby", x.description || "", { size: 9.5, lh: 13.5, before: i === 0 ? 7 : 3, sep: ": ", leadColor: cTitle, restColor: cInk }); });
      }
    });

    /* ----- pagination : un titre n'est jamais seul en bas de page ----- */
    var y = PDFG.MT, atTop = true;
    function newPage() { doc.addPage(); y = PDFG.MT; atTop = true; }
    var i = 0;
    while (i < blocks.length) {
      var j = i;
      while (j < blocks.length - 1 && blocks[j].keep) j++;
      var need = 0, k;
      for (k = i; k <= j; k++) need += (k === i && atTop ? 0 : blocks[k].before) + blocks[k].h;
      if (!atTop && y + need > USABLE && need <= USABLE - PDFG.MT) newPage();
      for (k = i; k <= j; k++) {
        var b = blocks[k], gap = atTop ? 0 : b.before;
        if (!atTop && y + gap + b.h > USABLE) { newPage(); gap = 0; }
        y += gap; b.draw(y); y += b.h; atTop = false;
      }
      i = j + 1;
    }

    var name = S(p.fullName || "Resume");
    try { doc.setProperties({ title: name + " - Resume", author: name, subject: "Resume" }); } catch (e) { /* facultatif */ }
    try { doc.setLanguage(curLang() === "en" ? "en-US" : curLang()); } catch (e) { /* facultatif */ }
    return { bytes: doc.output("arraybuffer"), name: name.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "") + "_Resume_" + curLang().slice(0, 2).toUpperCase() + ".pdf", lost: lost, pages: doc.getNumberOfPages() };
  }

  function exportPdf() {
    if (!downloadsApi) return;
    var b = $("export");
    b.disabled = true;
    loadPhoto(state.profile && state.profile.photoAssetId).then(function (photo) {
      var out = buildPdf(photo);
      return downloadsApi.save({ filename: out.name, data: out.bytes }).then(function () {
        toast(out.lost ? "PDF saved. " + out.lost + " character(s) outside the PDF font were replaced with “?”." : "PDF saved.");
      });
    }).catch(function (e) {
      toast(e && e.code === "declined" ? "Export cancelled." : "Export failed: " + (e && e.message ? e.message : "unknown error"));
    }).then(function () { b.disabled = false; });
  }

  /* ---------- Démarrage ---------- */
  function showError(msg) {
    $("empty").hidden = false; $("sheet").hidden = true; $("warnings").hidden = true;
    clear($("empty"));
    $("empty").appendChild(h("h1", null, "Database unavailable"));
    $("empty").appendChild(h("p", null, msg));
  }
  function panelBusy() {
    var a = document.activeElement, p = $("panel");
    return !!(a && p.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
  }

  applyTheme();
  $("toggle").addEventListener("click", function () { setPanel(!state.panelOpen); });
  $("export").addEventListener("click", exportPdf);
  $("versions").addEventListener("click", toggleMenu);
  $("prefs").addEventListener("click", togglePrefs);
  window.claude.use("assets").then(function (a) { assetsApi = a; }, function () { assetsApi = null; });
  window.claude.use("downloads").then(function (a) { downloadsApi = a; if (db) render(); }, function () { downloadsApi = null; });
  window.claude.use("db").then(function (store) {
    if (!store) { showError("Open this artifact signed in to your account to view your profile."); return; }
    db = store;
    $("toggle").hidden = false;
    $("prefs").hidden = false;
    var onErr = function () { showError("Could not read the database. Reload the page."); };
    db.doc("meta/import").onSnapshot(function (s) { state.meta = s.exists ? s.data() : null; render(); }, onErr);
    db.doc("settings/preferences").onSnapshot(function (s) { state.prefs = s.exists ? s.data() : null; }, onErr);
    db.collection("answers").onSnapshot(function (snap) {
      state.answers = {};
      snap.docs.forEach(function (d) { state.answers[d.id] = d.data(); });
    }, onErr);
    db.doc("settings/layout").onSnapshot(function (s) {
      state.settings = norm(s.exists ? s.data() : null);
      recompute(); applyTheme(); render();
      if (state.panelOpen && !panelBusy()) renderPanel();
    }, onErr);
    db.collection("versions").onSnapshot(function (snap) {
      state.versions = {};
      snap.docs.forEach(function (d) { state.versions[d.id] = d.data(); });
      recompute(); applyTheme(); render();
      if (menuOpen) renderMenu();
      if (state.panelOpen && !panelBusy()) renderPanel();
    }, onErr);
  }, function () { showError("Database capability unavailable."); });
})();
</script>
